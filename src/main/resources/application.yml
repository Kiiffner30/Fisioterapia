spring:
  profiles:
    # Perfil padrao: dev (sobrescreva com SPRING_PROFILES_ACTIVE=prod em producao)
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: fisioterapia-backend

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.timeout: 30

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: America/Sao_Paulo
    locale: pt-BR

server:
  port: ${SERVER_PORT:8080}

# --- JWT / sessoes ---
# O segredo e as credenciais NAO ficam aqui: sao definidos por perfil.
#   application-dev.yml  -> defaults locais (com placeholders + fallback)
#   application-prod.yml -> sem defaults (exige variaveis de ambiente)
jwt:
  access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}

app:
  cookie:
    name: refresh_token
    path: /api
    secure: ${COOKIE_SECURE:false}
    same-site: lax

logging:
  level:
    root: INFO
    com.clinica.fisioterapia: DEBUG