services:
  db:
    image: postgres:16
    container_name: fisioterapia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fisioterapia}
      POSTGRES_USER: ${POSTGRES_USER:-fisioterapia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fisioterapia_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fisioterapia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisioterapia} -d ${POSTGRES_DB:-fisioterapia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fisioterapia_pgdata: