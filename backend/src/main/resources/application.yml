spring:
  application:
    name: fisioterapia-backend

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:fisioterapia}
    username: ${DATABASE_USERNAME:fisioterapia}
    password: ${DATABASE_PASSWORD:fisioterapia_dev}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.timeout: 30

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: America/Sao_Paulo
    locale: pt-BR

server:
  port: ${SERVER_PORT:8080}

# --- JWT / sesiones ---
jwt:
  secret: ${JWT_SECRET:solo-desarrollo-local-cambiar-en-produccion-0123456789abcdef}
  access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    name: refresh_token
    path: /api
    secure: ${COOKIE_SECURE:false}
    same-site: lax
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@clinica.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}

logging:
  level:
    root: INFO
    com.clinica.fisioterapia: DEBUG